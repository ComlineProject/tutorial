yarnPath: .yarn/releases/yarn-4.18.0.cjs
nodeLinker: node-modules

# `comline-web-kit` (the playground's simulate view, a workspace of the
# playground repo) and `comline-simulator` (its engine) are git deps that
# build in their `prepack`. Yarn 4 gates git deps and disables scripts by
# default; both are needed. The builds are not byte-reproducible (wasm-opt
# runs only where installed) so let Yarn refresh the tarball checksums.
approvedGitRepositories:
  - "https://github.com/ComlineProject/playground.git"
  - "https://github.com/ComlineProject/simulator.git"
enableScripts: true
checksumBehavior: update
