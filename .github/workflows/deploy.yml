name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

jobs:
  build_site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      # `comline-simulator` is a git dependency that compiles to WASM in its
      # `prepack` (Rust → wasm-bindgen). The runner has cargo + wasm-opt; this
      # caches the one-time `wasm-bindgen-cli` build across runs.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        env:
          COMLINE_SIMULATOR_SCRIPT: '0' # the tutorial only needs the lean sim
        run: yarn install

      - name: build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: yarn build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # this should match the `pages` option in your adapter-static options
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
